<title>词组记忆本</title>
<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
    -webkit-touch-callout: none;
    user-select: none;
}

:root {
    --bg: #fafafa;
    --surface: #ffffff;
    --text: #111111;
    --text-2: #555555;
    --text-3: #999999;
    --line: #f0f0f0;
    --accent: #2f6bff;
    --green: #2fbf71;
    --red: #ff5a5a;
    --shadow: 0 1px 2px rgba(0,0,0,0.04), 0 8px 24px rgba(0,0,0,0.06);
    --safe-top: env(safe-area-inset-top, 0px);
    --safe-bottom: env(safe-area-inset-bottom, 0px);
}

html, body {
    height: 100%;
    width: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue", sans-serif;
    overflow: hidden;
    position: fixed;
    top: 0;
    left: 0;
}

body {
    padding: var(--safe-top) 16px calc(var(--safe-bottom) + 20px);
}

.app {
    width: 100%;
    height: 100%;
    max-width: 480px;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
}

/* 顶部导航 */
.navbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    height: 44px;
    flex-shrink: 0;
}

.navbar h1 {
    font-size: 17px;
    font-weight: 600;
}

.nav-btn {
    width: 36px;
    height: 36px;
    border-radius: 12px;
    border: none;
    background: var(--surface);
    color: var(--text-2);
    font-size: 16px;
    cursor: pointer;
    box-shadow: var(--shadow);
}

/* 页面容器 */
.page {
    flex: 1;
    display: flex;
    flex-direction: column;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    padding-bottom: 10px;
}

.page::-webkit-scrollbar { display: none; }

.hidden { display: none !important; }

/* 导入页 */
.import-card {
    background: var(--surface);
    border-radius: 20px;
    padding: 20px;
    margin-top: 10px;
    box-shadow: var(--shadow);
}

.import-card h2 {
    font-size: 16px;
    font-weight: 600;
    margin-bottom: 12px;
}

textarea {
    width: 100%;
    min-height: 140px;
    padding: 14px;
    border: 1px solid var(--line);
    border-radius: 14px;
    font-size: 14px;
    line-height: 1.6;
    resize: none;
    background: #fbfbfd;
    color: var(--text);
    outline: none;
    user-select: text;
}

textarea:focus {
    border-color: var(--accent);
    background: #fff;
}

.btn-group {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-top: 14px;
}

.btn {
    border: none;
    border-radius: 14px;
    padding: 11px 16px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    color: #fff;
    background: var(--accent);
    transition: opacity 0.2s;
}

.btn:active { opacity: 0.85; }

.btn.secondary {
    background: #f3f4f7;
    color: var(--text);
}

.btn.red { background: var(--red); }

.file-input { display: none; }

.tip {
    font-size: 12px;
    color: var(--text-3);
    margin-top: 10px;
    line-height: 1.5;
}

/* 学习页 - 进度区 */
.progress-card {
    background: var(--surface);
    border-radius: 20px;
    padding: 16px 18px;
    margin-top: 10px;
    box-shadow: var(--shadow);
    flex-shrink: 0;
}

.progress-top {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin-bottom: 8px;
}

.progress-label {
    font-size: 13px;
    color: var(--text-2);
}

.progress-num {
    font-size: 13px;
    font-weight: 600;
}

.progress-bar {
    width: 100%;
    height: 6px;
    background: #f3f4f7;
    border-radius: 999px;
    overflow: hidden;
}

.progress-fill {
    height: 100%;
    width: 0%;
    background: var(--accent);
    border-radius: 999px;
    transition: width 0.3s ease;
}

.stats-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 8px;
    margin-top: 14px;
}

.stat {
    text-align: center;
    padding: 10px 4px;
    background: #fafbfd;
    border-radius: 12px;
}

.stat-num {
    font-size: 17px;
    font-weight: 700;
}

.stat-label {
    font-size: 11px;
    color: var(--text-3);
    margin-top: 2px;
}

/* 学习时长统计 */
.stats-card {
    background: var(--surface);
    border-radius: 20px;
    padding: 16px 18px;
    margin-top: 12px;
    box-shadow: var(--shadow);
    flex-shrink: 0;
}

.stats-row {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
}

.tstat {
    text-align: center;
    padding: 10px 4px;
    background: #fafbfd;
    border-radius: 12px;
}

.tstat-num {
    font-size: 17px;
    font-weight: 700;
    color: var(--text);
}

.tstat-label {
    font-size: 11px;
    color: var(--text-3);
    margin-top: 2px;
}

.week-bars {
    display: flex;
    align-items: flex-end;
    gap: 6px;
    margin-top: 14px;
    height: 72px;
}

.week-col {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
    height: 100%;
    justify-content: flex-end;
}

.week-bar {
    width: 100%;
    max-width: 26px;
    background: #e3e9ff;
    border-radius: 6px;
    min-height: 3px;
    transition: height 0.3s ease;
}

.week-col.today .week-bar { background: var(--accent); }

.week-day {
    font-size: 10px;
    color: var(--text-3);
}

/* 模式切换 */
.mode-tab {
    display: flex;
    gap: 8px;
    margin: 14px 0;
    flex-shrink: 0;
}

.tab-btn {
    flex: 1;
    border: none;
    border-radius: 12px;
    padding: 10px 8px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    background: var(--surface);
    color: var(--text-2);
    box-shadow: var(--shadow);
}

.tab-btn.active {
    background: var(--text);
    color: #fff;
}

/* 卡片区域 */
.card-stage {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 10px 0;
}

.card-wrap {
    width: 100%;
    perspective: 1200px;
}

.flashcard {
    position: relative;
    width: 100%;
    aspect-ratio: 4 / 3;
    transform-style: preserve-3d;
    transition: transform 0.5s cubic-bezier(0.4, 0, 0.2, 1);
    cursor: pointer;
}

.flashcard.flipped {
    transform: rotateY(180deg);
}

.card-face {
    position: absolute;
    inset: 0;
    backface-visibility: hidden;
    -webkit-backface-visibility: hidden;
    border-radius: 24px;
    background: var(--surface);
    box-shadow: var(--shadow);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 24px;
    text-align: center;
}

.card-front .word {
    font-size: 34px;
    font-weight: 800;
    letter-spacing: 0.5px;
    line-height: 1.3;
}

.card-front .hint {
    margin-top: 12px;
    font-size: 13px;
    color: var(--text-3);
}

.card-back {
    transform: rotateY(180deg);
}

.card-back .meaning {
    font-size: 20px;
    line-height: 1.7;
    color: var(--text);
}

/* 底部操作栏 */
.action-bar {
    flex-shrink: 0;
    background: var(--surface);
    border-radius: 22px;
    padding: 14px;
    box-shadow: var(--shadow);
}

.action-row {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr 1fr;
    gap: 10px;
}

.action-btn {
    border: none;
    border-radius: 14px;
    padding: 13px 6px;
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
    color: #fff;
}

.action-btn.secondary {
    background: #f3f4f7;
    color: var(--text);
}

.action-btn.know { background: var(--green); }
.action-btn.unknow { background: var(--red); }

.action-hint {
    text-align: center;
    font-size: 12px;
    color: var(--text-3);
    margin-top: 10px;
}

/* Toast */
.toast {
    position: fixed;
    left: 50%;
    top: calc(var(--safe-top) + 50px);
    transform: translateX(-50%);
    background: rgba(17,17,17,0.92);
    color: #fff;
    padding: 10px 18px;
    border-radius: 999px;
    font-size: 14px;
    z-index: 999;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.25s ease;
}

.toast.show { opacity: 1; }

/* 安装提示 */
.install-tip {
    background: var(--accent);
    color: #fff;
    border-radius: 14px;
    padding: 12px 14px;
    font-size: 13px;
    line-height: 1.5;
    margin-top: 12px;
}
</style>

<body>

<div class="app">
    <!-- 顶部导航 -->
    <div class="navbar">
        <h1>词组记忆本</h1>
        <button class="nav-btn" id="menuBtn" onclick="toggleMenu()">☰</button>
    </div>

    <!-- 导入页面 -->
    <div class="page" id="importPage">
        <div class="import-card">
            <h2>导入词组库</h2>
            <textarea id="inputArea" placeholder="粘贴词组，每行一组，格式：英文词组 + 中文释义
示例：
a bid to do sth. 努力做某事
above all 首先，尤其是"></textarea>
            <div class="btn-group">
                <button class="btn" onclick="importWords()">开始学习</button>
                <button class="btn secondary" onclick="document.getElementById('fileInput').click()">导入备份</button>
                <button class="btn secondary" onclick="exportBackup()">导出备份</button>
                <input type="file" id="fileInput" class="file-input" accept=".json" onchange="importBackup(event)">
            </div>
            <div class="tip">
                提示：词组会自动永久保存在本地<br>
                点击浏览器「添加到主屏幕」可变成独立APP
            </div>
        </div>

        <div class="install-tip" id="installTip">
            💡 想变成桌面 App？<br>
            点 Safari 底部「分享」按钮（方块⬆）→ 选「添加到主屏幕」
        </div>
    </div>

    <!-- 学习页面 -->
    <div class="page hidden" id="studyPage">
        <div class="progress-card">
            <div class="progress-top">
                <span class="progress-label">学习进度</span>
                <span class="progress-num" id="progressText">0 / 0</span>
            </div>
            <div class="progress-bar">
                <div class="progress-fill" id="progressFill"></div>
            </div>
            <div class="stats-grid">
                <div class="stat">
                    <div class="stat-num" id="timer">00:00</div>
                    <div class="stat-label">本次</div>
                </div>
                <div class="stat">
                    <div class="stat-num" id="totalNum">0</div>
                    <div class="stat-label">总词</div>
                </div>
                <div class="stat">
                    <div class="stat-num" id="knowNum">0</div>
                    <div class="stat-label">掌握</div>
                </div>
                <div class="stat">
                    <div class="stat-num" id="unknowNum">0</div>
                    <div class="stat-label">生词</div>
                </div>
            </div>
        </div>

        <div class="stats-card">
            <div class="stats-row">
                <div class="tstat">
                    <div class="tstat-num" id="todayTime">0秒</div>
                    <div class="tstat-label">今日学习</div>
                </div>
                <div class="tstat">
                    <div class="tstat-num" id="monthTime">0秒</div>
                    <div class="tstat-label">本月学习</div>
                </div>
                <div class="tstat">
                    <div class="tstat-num" id="monthDays">0天</div>
                    <div class="tstat-label">本月打卡</div>
                </div>
            </div>
            <div class="week-bars" id="weekBars"></div>
        </div>

        <div class="mode-tab">
            <button class="tab-btn active" id="tabAll" onclick="allMode()">全部词组</button>
            <button class="tab-btn" id="tabReview" onclick="reviewMode()">复习生词</button>
            <button class="tab-btn" onclick="shuffleList()">打乱</button>
        </div>

        <div class="card-stage">
            <div class="card-wrap">
                <div class="flashcard" id="flashcard" onclick="flipCard()">
                    <div class="card-face card-front">
                        <div class="word" id="cardFront">点击开始</div>
                        <div class="hint">点击卡片查看释义</div>
                    </div>
                    <div class="card-face card-back">
                        <div class="meaning" id="cardBack"></div>
                    </div>
                </div>
            </div>
        </div>

        <div class="action-bar">
            <div class="action-row">
                <button class="action-btn secondary" onclick="prevCard()">上一个</button>
                <button class="action-btn know" onclick="markKnow()">认识</button>
                <button class="action-btn unknow" onclick="markUnknow()">不认识</button>
                <button class="action-btn secondary" onclick="nextCard()">下一个</button>
            </div>
            <div class="action-hint">标记后自动进入下一词组</div>
        </div>
    </div>
</div>

<div class="toast" id="toast"></div>

<script>
const STORAGE_KEY = "phrase_app_v1";
let allPhrases = [];
let currentList = [];
let currentIndex = 0;
let isFlipped = false;
let timer = null;
let seconds = 0;
let isAppMode = window.matchMedia('(display-mode: standalone)').matches;

// 学习时长记录（每日/每月）
const TIME_KEY = "phrase_app_time_v1";
let timeLog = {};          // { "YYYY-MM-DD": 秒 }
let pendingSeconds = 0;    // 尚未落盘的秒数
let studyPaused = false;   // 页面切后台时暂停计时

// 初始化
window.onload = function () {
    loadTimeLog();

    if (isAppMode) {
        document.getElementById('installTip').classList.add('hidden');
    }

    const saved = localStorage.getItem(STORAGE_KEY);
    if (saved) {
        try {
            allPhrases = JSON.parse(saved);
            if (allPhrases.length > 0) {
                enterStudy();
            }
        } catch (e) {}
    }
};

function saveData() {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(allPhrases));
}

// —— 学习时长记录 ——
function todayKey(d) {
    d = d || new Date();
    const y = d.getFullYear();
    const m = String(d.getMonth() + 1).padStart(2, "0");
    const day = String(d.getDate()).padStart(2, "0");
    return `${y}-${m}-${day}`;
}

function loadTimeLog() {
    try { timeLog = JSON.parse(localStorage.getItem(TIME_KEY)) || {}; }
    catch (e) { timeLog = {}; }
}

function saveTimeLog() {
    localStorage.setItem(TIME_KEY, JSON.stringify(timeLog));
}

function flushTime() {
    if (pendingSeconds <= 0) return;
    const k = todayKey();
    timeLog[k] = (timeLog[k] || 0) + pendingSeconds;
    pendingSeconds = 0;
    saveTimeLog();
    updateTimeStats();
    renderWeekBars();
}

function fmtDuration(sec) {
    sec = Math.floor(sec || 0);
    if (sec < 60) return sec + "秒";
    const m = Math.floor(sec / 60);
    if (m < 60) return m + "分钟";
    const h = Math.floor(m / 60);
    return h + "小时" + (m % 60) + "分";
}

function updateTimeStats() {
    const today = todayKey();
    const monthPrefix = today.slice(0, 7);
    let monthSec = 0, monthDays = 0;
    for (const k in timeLog) {
        if (k.indexOf(monthPrefix) === 0) {
            monthSec += timeLog[k];
            if (timeLog[k] > 0) monthDays++;
        }
    }
    const todaySec = (timeLog[today] || 0) + pendingSeconds;
    document.getElementById("todayTime").textContent = fmtDuration(todaySec);
    document.getElementById("monthTime").textContent = fmtDuration(monthSec);
    document.getElementById("monthDays").textContent = monthDays + "天";
}

function renderWeekBars() {
    const bars = document.getElementById("weekBars");
    if (!bars) return;
    const today = new Date();
    const labels = ["日", "一", "二", "三", "四", "五", "六"];
    let html = "";
    let maxSec = 0;
    const days = [];
    for (let i = 6; i >= 0; i--) {
        const d = new Date(today.getFullYear(), today.getMonth(), today.getDate() - i);
        const key = todayKey(d);
        const sec = timeLog[key] || 0;
        days.push({ key, sec, day: d.getDay() });
        if (sec > maxSec) maxSec = sec;
    }
    for (let i = 0; i < days.length; i++) {
        const d = days[i];
        const isToday = d.key === todayKey();
        const h = maxSec > 0 ? Math.max(6, Math.round((d.sec / maxSec) * 60)) : 3;
        html += `<div class="week-col${isToday ? " today" : ""}">
            <div class="week-bar" style="height:${h}px"></div>
            <div class="week-day">${labels[d.day]}</div>
        </div>`;
    }
    bars.innerHTML = html;
}

function toast(msg) {
    const t = document.getElementById("toast");
    t.textContent = msg;
    t.classList.add("show");
    clearTimeout(t._timer);
    t._timer = setTimeout(() => t.classList.remove("show"), 1500);
}

function toggleMenu() {
    if (document.getElementById('studyPage').classList.contains('hidden')) {
        // 在导入页
        toast('导入词组后即可开始学习');
    } else {
        // 在学习页，显示操作
        if (confirm('返回导入页？进度不会丢失')) {
            document.getElementById('studyPage').classList.add('hidden');
            document.getElementById('importPage').classList.remove('hidden');
            flushTime();
            clearInterval(timer);
        }
    }
}

// 解析词组
function parseLine(line) {
    line = line.trim();
    if (!line) return null;
    const cnMatch = line.match(/[\u4e00-\u9fa5]/);
    if (!cnMatch) return null;

    const splitPos = line.indexOf(cnMatch[0]);
    const english = line.slice(0, splitPos).trim();
    const chinese = line.slice(splitPos).trim();

    if (!english || !chinese) return null;
    return { eng: english, chn: chinese, status: 0 };
}

// 导入
function importWords() {
    const text = document.getElementById("inputArea").value.trim();
    if (!text) {
        toast("请粘贴词组内容");
        return;
    }

    const lines = text.split("\n");
    let newCount = 0;

    for (let line of lines) {
        const item = parseLine(line);
        if (item) {
            const exist = allPhrases.find(p => p.eng === item.eng);
            if (!exist) {
                allPhrases.push(item);
                newCount++;
            }
        }
    }

    if (newCount === 0 && allPhrases.length === 0) {
        toast("未识别到有效词组");
        return;
    }

    saveData();
    document.getElementById("inputArea").value = "";
    enterStudy();
    toast(`导入 ${newCount} 条词组`);
}

// 进入学习页
function enterStudy() {
    document.getElementById('importPage').classList.add('hidden');
    document.getElementById('studyPage').classList.remove('hidden');

    currentList = [...allPhrases];
    currentIndex = 0;
    isFlipped = false;

    startTimer();
    renderCard();
    updateStats();
    updateTimeStats();
    renderWeekBars();
}

// 计时器（学习时长）
function startTimer() {
    clearInterval(timer);
    seconds = 0;
    pendingSeconds = 0;
    studyPaused = false;
    updateTimerText();
    timer = setInterval(() => {
        if (studyPaused) return;
        seconds++;
        pendingSeconds++;
        updateTimerText();
        updateTimeStats();
        if (pendingSeconds >= 5) flushTime();
    }, 1000);
}

function updateTimerText() {
    const m = String(Math.floor(seconds / 60)).padStart(2, "0");
    const s = String(seconds % 60).padStart(2, "0");
    document.getElementById("timer").textContent = `${m}:${s}`;
}

// 渲染卡片
function renderCard() {
    if (currentList.length === 0) return;
    const item = currentList[currentIndex];
    document.getElementById("cardFront").textContent = item.eng;
    document.getElementById("cardBack").textContent = item.chn;

    if (isFlipped) {
        document.getElementById("flashcard").classList.remove("flipped");
        isFlipped = false;
    }
}

function flipCard() {
    isFlipped = !isFlipped;
    document.getElementById("flashcard").classList.toggle("flipped");
}

function prevCard() {
    if (currentIndex > 0) {
        currentIndex--;
        renderCard();
        updateStats();
    }
}

function nextCard() {
    if (currentIndex < currentList.length - 1) {
        currentIndex++;
        renderCard();
        updateStats();
    }
}

function markKnow() {
    const item = currentList[currentIndex];
    const target = allPhrases.find(p => p.eng === item.eng);
    if (target) target.status = 1;
    saveData();
    nextCard();
    updateStats();
}

function markUnknow() {
    const item = currentList[currentIndex];
    const target = allPhrases.find(p => p.eng === item.eng);
    if (target) target.status = -1;
    saveData();
    nextCard();
    updateStats();
}

function updateStats() {
    const know = allPhrases.filter(p => p.status === 1).length;
    const unknow = allPhrases.filter(p => p.status === -1).length;
    const total = allPhrases.length;

    document.getElementById("totalNum").textContent = total;
    document.getElementById("knowNum").textContent = know;
    document.getElementById("unknowNum").textContent = unknow;

    const progress = currentList.length > 0
        ? ((currentIndex + 1) / currentList.length * 100).toFixed(1)
        : 0;

    document.getElementById("progressFill").style.width = progress + "%";
    document.getElementById("progressText").textContent = `${currentIndex + 1} / ${currentList.length}`;
}

function reviewMode() {
    currentList = allPhrases.filter(p => p.status === -1);
    if (currentList.length === 0) {
        toast("暂无需复习的词组");
        return;
    }
    currentIndex = 0;
    document.getElementById("tabAll").classList.remove("active");
    document.getElementById("tabReview").classList.add("active");
    renderCard();
    updateStats();
}

function allMode() {
    currentList = [...allPhrases];
    currentIndex = 0;
    document.getElementById("tabReview").classList.remove("active");
    document.getElementById("tabAll").classList.add("active");
    renderCard();
    updateStats();
}

function shuffleList() {
    for (let i = currentList.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [currentList[i], currentList[j]] = [currentList[j], currentList[i]];
    }
    currentIndex = 0;
    renderCard();
    updateStats();
    toast("已打乱顺序");
}

// 导出备份
function exportBackup() {
    if (allPhrases.length === 0) {
        toast("暂无数据可导出");
        return;
    }
    flushTime();
    const dataStr = JSON.stringify({ phrases: allPhrases, timeLog: timeLog }, null, 2);
    const blob = new Blob([dataStr], { type: "application/json" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = "词组记忆备份.json";
    a.click();
    URL.revokeObjectURL(url);
    toast("备份已导出");
}

// 导入备份
function importBackup(e) {
    const file = e.target.files[0];
    if (!file) return;

    const reader = new FileReader();
    reader.onload = function (evt) {
        try {
            const raw = JSON.parse(evt.target.result);
            if (Array.isArray(raw)) {
                allPhrases = raw;               // 旧版备份（纯词组数组）
            } else {
                allPhrases = raw.phrases || [];
                timeLog = raw.timeLog || {};
                saveTimeLog();
            }
            saveData();
            enterStudy();
            toast(`导入成功，共 ${allPhrases.length} 条`);
        } catch (err) {
            toast("备份文件解析失败");
        }
    };
    reader.readAsText(file);
    e.target.value = "";
}

// 重置
function resetProgress() {
    if (!confirm("确定重置所有记忆标记吗？词组会保留。")) return;
    allPhrases.forEach(p => p.status = 0);
    saveData();
    currentList = [...allPhrases];
    currentIndex = 0;
    renderCard();
    updateStats();
    toast("进度已重置");
}

window.addEventListener('beforeunload', () => {
    flushTime();
    clearInterval(timer);
});

// 切到后台时暂停计时并落盘，回来继续
document.addEventListener('visibilitychange', () => {
    if (document.hidden) {
        studyPaused = true;
        flushTime();
    } else {
        studyPaused = false;
    }
});
</script>
